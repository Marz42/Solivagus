[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solivagus"
version = "0.1.0"
description = "Local technical PDF translation CLI (PaddleOCR-VL + DeepSeek)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
dependencies = [
  "PyYAML>=6.0,<7",
  "typer>=0.12",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
]
# GPU/OCR pins are tracked in requirements-gpu.txt for the verified local stack.
gpu = []

[project.scripts]
solivagus = "solivagus.cli:main"
pd = "paradigma.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paradigma = ["py.typed", "storage/catalog/*.sql"]
solivagus = ["py.typed", "schema.sql"]

[tool.uv]
package = true
