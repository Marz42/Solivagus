# Example Solivagus config profile (Phase 1+)
# Copy values into your environment or load via future --config support.

workspace: "."
batch_dir: "D:/PDFS"

provider:
  name: openai-compatible
  base_url: "https://api.deepseek.com"
  model: deepseek-v4-flash
  thinking: disabled
  temperature: 0.1
  timeout_seconds: 300

translation:
  target_language: "zh-CN"
  chunk_chars: 12000  # OCR provisional seeds only; plan uses token budgets
  fallback_to_source: true
  strict: false

planning:
  unit_target_tokens: 12000
  unit_max_tokens: 24000
  unit_min_tokens: 1500
  first_partition_tokens: 96000
  partition_target_tokens: 220000
  partition_max_tokens: 300000
  price:
    cache_hit_per_million: 0.02
    cache_miss_per_million: 1.00
    output_per_million: 2.00
    currency: CNY

cache:
  target_mode: repeat
  prompt_version: translate-v1
  probe_min_ratio: 0.70
  warning_ratio: 0.50
  settle_seconds: 0
  enable_local_translation_cache: true

concurrency:
  global: 16
  per_document: 8
  per_partition: 8
  max_global: 64
  low_probe: 2
  adaptive: true
